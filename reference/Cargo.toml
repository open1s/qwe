[package]
name = "pwe-reference"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
publish = false
license = "Apache-2.0"

[features]
# macOS-only Metal GPU acceleration for field sweeps (opt-in; `pwe run --gpu`).
# The `metal` dependency is target-gated so non-macOS CI never builds it.
gpu = ["dep:metal"]

[dependencies]
pwe-api = { path = ".." }
# Language front end grammar (PEST). Pinned below 2.8 for MSRV compatibility
# with the crate's rust-version (1.81).
pest = ">=2.9.1"
pest_derive = ">=2.9.1"

[[bench]]
name = "throughput"
harness = false

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
